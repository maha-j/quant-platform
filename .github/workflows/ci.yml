# Pipeline CI — GitHub Actions (emplacement requis par GitHub).
# Source canonique documentée aussi dans cicd/pipelines/ci.yml.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # permet la relance manuelle depuis l'onglet Actions / gh

jobs:
  python:
    name: Python · lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e "./python[dev]"
      - name: Ruff
        run: ruff check python ml backtests
      - name: Pytest + couverture
        run: pytest tests/unit -q --cov=python --cov=ml --cov=backtests --cov-report=xml
        env:
          PYTHONPATH: ${{ github.workspace }}/python:${{ github.workspace }}
      - name: Upload couverture (Codecov)
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false      # ne casse pas la CI si l'upload échoue
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  cpp:
    name: C++ · build + GoogleTest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deps
        run: sudo apt-get update && sudo apt-get install -y cmake libfmt-dev libspdlog-dev libeigen3-dev
      - name: Configure
        run: cmake -S cpp -B build -DCMAKE_BUILD_TYPE=Release -DQUANT_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Test
        run: ctest --test-dir build --output-on-failure
