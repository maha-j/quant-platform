# Provider de dashboards : charge les JSON de monitoring/grafana/dashboards.
apiVersion: 1

providers:
  - name: quant-dashboards
    orgId: 1
    folder: Quant
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
