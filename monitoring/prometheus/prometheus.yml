# Configuration de scraping Prometheus.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml   # monté depuis monitoring/alerts

scrape_configs:
  - job_name: execution
    metrics_path: /metrics
    static_configs:
      - targets: ["execution:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
